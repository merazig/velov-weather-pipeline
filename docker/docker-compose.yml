services:

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${MONGO_USERNAME}",
          "--password",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  extraction:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: velov-extraction
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
  
  spark-master:
    image: spark:4.1.2-python3
    container_name: spark-master
    environment:
      SPARK_JARS_PACKAGES: org.mongodb.spark:mongo-spark-connector_2.12:10.7.0
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: spark:4.1.2-python3
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_JARS_PACKAGES: org.mongodb.spark:mongo-spark-connector_2.12:10.7.0
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
    ports:
      - "8081:8081"

  spark-driver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: spark-driver
    depends_on:
      - spark-master
      - spark-worker
      - mongodb
    working_dir: /app
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}

      SPARK_JARS_PACKAGES: org.mongodb.spark:mongo-spark-connector_2.13:11.1.0
      PYTHONPATH: /opt/spark/python:/app
    command: ["sleep", "infinity"]


volumes:
  minio_data:
  mongo_data: